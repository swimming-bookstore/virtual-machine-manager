d-i mirror/http/hostname string deb.debian.org
d-i passwd/root-login boolean false
d-i passwd/user-fullname string debian
d-i passwd/username string debian
d-i passwd/user-password password debian
d-i passwd/user-password-again password debian
d-i partman-auto/disk string /dev/vda
d-i grub-installer/bootdev string /dev/vda
tasksel tasksel/first multiselect xfce-desktop
d-i pkgsel/include string openssh-server spice-vdagent
popularity-contest popularity-contest/participate boolean false
d-i preseed/late_command string test -s /target/etc/debian_version && test -e /target/boot/grub/grub.cfg && mkdir -p /target/home/debian/.ssh && cp /authorized_keys /target/home/debian/.ssh/authorized_keys && chmod 700 /target/home/debian/.ssh && chmod 600 /target/home/debian/.ssh/authorized_keys && chroot /target chown -R debian:debian /home/debian/.ssh && mkdir -p /target/etc/systemd/system/tmp.mount.d && printf '%s\n' '[Mount]' 'Options=mode=1777,nosuid,nodev,size=4G' > /target/etc/systemd/system/tmp.mount.d/override.conf && sync && poweroff
